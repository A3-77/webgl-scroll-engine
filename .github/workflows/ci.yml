name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 的并发 push 取消旧的运行（节省 CI 分钟）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Independence check (delete a content pack, build must still pass)
        run: npm run verify:independence

  python-pipeline:
    name: Python pipeline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/build-assets/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/build-assets/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Asset pipeline operator self-tests (17 assertions)
        run: npm run build-assets:selftest

      - name: Asset pipeline dry-run on bundled input
        run: npm run build-assets:check